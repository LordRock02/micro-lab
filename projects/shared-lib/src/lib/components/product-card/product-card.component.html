<div class="card">
  <div class="image-container">
    <img [src]="product.image" [alt]="product.name">
  </div>
  
  <div class="info">
    <h3>{{ product.name }}</h3>
    <p class="description">{{ product.description }}</p>
    
    <div class="footer">
      <span class="price">{{ product.price | currency:'USD' }}</span>
      <button (click)="addToCart()">Agregar 🛒</button>
    </div>
  </div>
</div>
